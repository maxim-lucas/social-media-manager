  }).join("");
  const n = drops.length, recs = new Set(drops.map((k) => NAME[k].groc)).size;
  const minDays = n ? Math.min(...drops.map((k) => +STATES[state][k][1].match(/(\d+)d left/)[1])) : 0;

const TIERS = { normal: ["#F3F4F6", "#6B7280", "pricetag-outline", "Regular"], good: ["#DBEAFE", "#1D4ED8", "trending-down-outline", "Good deal"], best: ["#D1FAE5", "#065F46", "flame-outline", "Best price"] };
const SIGNALS = {
  regular: ["Regular price", "Costco's standard everyday price — still good value."],
  instant_savings: ["Instant savings", "This item is on sale right now — the instant savings make it a good deal."],
  markdown_97: ["Corporate markdown", "The price ends in .97 — Costco head office officially marked this down. Limited time, so buy now."],
  manager_markdown_00: ["Manager markdown", "The price ends in .00 — the store manager wants this gone. Returns, floor models or almost no stock left. Grab it."],
  clearance_88: ["Store clearance", "The price ends in .88 — store-level clearance or lucky-number pricing. A deep discount."],
  manufacturer_promo: ["Manufacturer promo", "The price ends in .X9 — a special offer from the brand, not from Costco. Usually a trial run or below regular retail."],
};
// shared/priceSignal.js decodePriceEnding, verbatim logic
function decodeEnding(n) {
  const c = Math.round(n * 100) % 100;
  if (c === 97) return ["markdown_97", "good"];
  if (c === 0) return ["manager_markdown_00", "best"];
  if (c === 88) return ["clearance_88", "best"];
  if (c % 10 === 9 && c !== 99) return ["manufacturer_promo", "good"];
  return ["regular", "normal"];
}
function dealBadge(signal, tier, star = false) {

    const p = ease(since / .28), prev = SCRIPT[i - 1];
    html = `<div style="position:absolute;inset:0;transform:translateX(${(-90 * p).toFixed(1)}px)">${prev[2](cur[0] - .001)}</div><div style="position:absolute;inset:0;transform:translateX(${(360 * (1 - p)).toFixed(1)}px);box-shadow:-8px 0 24px rgba(0,0,0,.12)">${cur[2](t)}</div>`;
  } else if (cur[0] === FADE_AT) {
    html = `<div style="position:absolute;inset:0">${SCRIPT[i - 1][2](t)}</div><div style="position:absolute;inset:0;opacity:${clamp(since / .5)}">${cur[2](t)}</div>`;
  } else html = cur[2](t);
  phone.innerHTML = html;
  // scroll: data-frac × the real overflow of the scroll content (layout-measured, like a ScrollView)
  const scale = phone.getBoundingClientRect().height / 760;
  for (const s of phone.querySelectorAll(".scroll[data-frac]")) {
    const over = Math.max(0, s.scrollHeight - (s.parentElement.clientHeight - s.offsetTop));
    s.style.transform = `translateY(${(-over * Number(s.dataset.frac)).toFixed(1)}px)`;
  }
  let extra = "";
  for (const [a, b, n] of NOTIFS) if (t >= a && t < b) {
    const inP = ease((t - a) / .35), outP = ease((t - (b - .3)) / .3);
    extra += `<div style="position:absolute;inset:0;transform:translateY(${(-140 * (1 - inP) - 140 * outP).toFixed(1)}px)">${notif(n)}</div>`;
  }
  if (FLASH >= 0 && t >= FLASH && t < FLASH + .3) extra += `<div class="flash" style="opacity:${(1 - (t - FLASH) / .3).toFixed(2)}"></div>`;
  const pr = phone.getBoundingClientRect();
  const at = (el) => { const r = el.getBoundingClientRect(); return [(r.left + r.width / 2 - pr.left) / scale, (r.top + r.height / 2 - pr.top) / scale]; };
  for (let [tt, x, y] of TAPS) {
    if (!(t >= tt - .05 && t < tt + .35)) continue;
    if (y === "btn") { const b = phone.querySelector(".btnP"); if (b) [x, y] = at(b); else y = 600; }
    if (y === "ci") { const b = phone.querySelectorAll(".sec2")[1]; if (b) [x, y] = at(b); else y = 400; }
    if (y === "save") { const b = phone.querySelector(".btnP"); if (b) [x, y] = at(b); else y = 560; }
    const pick = { tagSeg: () => phone.querySelectorAll(".seg")[1], trSeg: () => phone.querySelectorAll(".seg")[2],
      shutter: () => phone.querySelector(".vfShut"), yes: () => phone.querySelector(".dlg .yes"),
      input: () => phone.querySelector(".qIn"), switch: () => phone.querySelector(".sw"),
      claimBtn: () => phone.querySelector(".claim"), showR: () => phone.querySelector(".showR"),
      mark: () => phone.querySelectorAll(".sec2")[0], storesTab: () => phone.querySelectorAll(".tabbar .tab")[2],
      bestbuy: () => phone.querySelector('.stCard[data-id="bestbuy"]'), notifyCta: () => phone.querySelector(".mCta") }[y];
    if (pick) { const b = pick(); if (b) [x, y] = at(b); else y = 400; }
    // the element under the finger shows its pressed state, like a real tap
    if (t < tt + .25) {
      const target = document.elementFromPoint(pr.left + x * scale, pr.top + y * scale);
      const btn = target && target.closest(".btnP,.obBtn,.capture,.act,.fItem,.notif,.sec2,.fab,.row,.back,.claim,.showR,.seg,.vfShut,.qIn,.dB span");
      if (btn) btn.classList.add("pressed");
    }
    const p = clamp((t - tt + .05) / .4);
    extra += `<div class="tap" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;opacity:${(1 - p * .9).toFixed(2)};transform:scale(${(1 + p * .25).toFixed(2)})"></div>`;
  }
  if (extra) phone.insertAdjacentHTML("beforeend", extra);
}
window.renderAt(Number(new URLSearchParams(location.search).get("t") || 0));
</script></body></html>
