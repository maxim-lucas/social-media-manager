  app-recording.html — the PriceBack app, rebuilt from the app's own code (src/constants/theme.js,
  HomeScreen, ScanTemplate, ReceiptScanningAnimation, DetailScreen, App.js tab bar, BrandMark,
  i18n EN strings), animated as an Android screen recording. 360×640 dp at 3× = 1080×1920.
  window.renderAt(seconds) draws one frame; scenes/render.js screenshots every frame.

<body><div id="phone"></div>
<script>
const G = (name) => String.fromCodePoint({"home":62338,"receipt-outline":62735,"camera":61915,"storefront-outline":62888,"person-outline":62636,"search-outline":62819,"notifications-outline":62591,"checkmark-circle":61982,"time-outline":62942,"chevron-back":61993,"chevron-forward":62011,"images-outline":62354,"document-attach-outline":62124,"ticket-outline":62939,"add":61699,"flash-outline":62234,"lock-closed":62407,"document-text":62131,"folder-outline":62249,"ellipsis-vertical":62164,"close":62026,"receipt":62734,"grid-outline":62294,"pricetag-outline":62699,"language-outline":62378,"barcode-outline":61814,"arrow-back":61735,"menu":62545}[name]);
const I = (name, style = "") => `<span class="i" style="${style}">${G(name)}</span>`;
const GLYPH = `<svg width="W" height="W" viewBox="0 0 48 48"><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9 H35 V34 L32 37 L29 34 L26 37 L23 34 L20 37 L17 34 L14 37 L13 36 Z"/><path d="M17 16 L21.5 20.5 L25.5 17 L31 27"/><path d="M31 27 L27.4 26 M31 27 L31.7 23.2"/></g></svg>`;
const glyph = (w) => GLYPH.replace(/W/g, w);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const prog = (t, a, b) => ease((t - a) / (b - a));

// ── Data: real Costco regular prices (prod price_points, 2026-11-02) and real savings (Oct 2026). SOURCES.md
const ROWS = {
  tv:   { name: "Samsung QN80H Series 4K UHD Neo QLED TV",           price: 1808.24, save: 600,  chip: ["red", "Claim by Oct 26 · Last day"] },
  gen:  { name: "Generac Guardian Generator",                         price: 8999.99, save: 1000, chip: ["green", "Claim by Nov 8 · 13d left"] },
  cof:  { name: "Van Houtte Original House Blend Coffee K-Cup Pods",  price: 52.99,   save: 13,   chip: ["green", "Claim by Nov 21 · 25d left"] },
  ket:  { name: "Chefman Stainless Steel Kettle",                     price: 39.99,   save: 10,   chip: ["green", "Claim by Nov 18 · 22d left"] },
};
const URG = { green: ["#dcfce7", "#15803d"], red: ["#fee2e2", "#991b1b"] };
const money = (n) => n.toFixed(2);

function status(dark) {
  return `<div class="status ${dark ? "dark" : ""}"><span>9:41</span><span style="display:flex;gap:5px;align-items:center">
    <svg width="15" height="11" viewBox="0 0 15 11"><path d="M1 10h2V7H1zM5 10h2V5H5zM9 10h2V3H9zM13 10h2V1h-2z" fill="currentColor"/></svg>
    <svg width="15" height="11" viewBox="0 0 16 12"><path d="M8 11.5 15.5 3.6A11 11 0 0 0 .5 3.6z" fill="currentColor"/></svg>
    <svg width="22" height="11" viewBox="0 0 22 11"><rect x=".5" y=".5" width="18" height="10" rx="2.5" fill="none" stroke="currentColor"/><rect x="2" y="2" width="13" height="7" rx="1.2" fill="currentColor"/><rect x="19.5" y="3.5" width="1.5" height="4" rx=".7" fill="currentColor"/></svg>
  </span></div>`;
}
const nav = (dark) => `<div class="navpill ${dark ? "dark" : ""}"></div>`;

function rowHTML(r, drop) {
  const right = drop
    ? `<div class="right"><div class="sav">+$${money(r.save)}</div><div class="claim">Claim</div></div>`
    : `<div class="right"><div class="price">$${money(r.price)}</div></div>`;
  const chip = drop ? `<span class="chipD" style="background:${URG[r.chip[0]][0]};color:${URG[r.chip[0]][1]}">${r.chip[1]}</span>` : "";
  return `<div class="row"><div class="sbadge"><div class="co">CO</div></div>
    <div style="flex:1;min-width:0"><div class="iname">${r.name}</div><div class="chips">${chip}<span class="place">Costco</span></div></div>${right}</div>`;
}

function home({ drops = [], toClaim = 0, alerts = 0 } = {}) {
  const order = ["tv", "gen", "cof", "ket"];
  const sorted = [...order.filter((k) => drops.includes(k)).sort((a, b) => ROWS[b].save - ROWS[a].save), ...order.filter((k) => !drops.includes(k))];
  const rows = sorted.map((k) => rowHTML(ROWS[k], drops.includes(k))).join("");
  const n = drops.length;
  const pending = drops.reduce((s, k) => s + ROWS[k].save, 0);
  const heroInner = n > 0
    ? `<div class="dots"><i class="on"></i><i></i></div><div class="caps" style="color:var(--lime)">To claim</div>
       <div class="heroAmt"><span class="d">$</span><span class="n">${Math.floor(toClaim)}</span><span class="c">.${money(toClaim).split(".")[1]}</span></div>
       <div class="heroLine">${I("checkmark-circle", "font-size:15px;color:var(--lime)")}<span>${n} price drop${n > 1 ? "s" : ""} · on ${n > 2 ? 3 : n} receipt${n > 1 ? "s" : ""}</span></div>

function scanIntro() {

function docScanner(t0, t) {
  // System document scanner: live view of the paper receipt, edge detection, then capture.
  const found = clamp((t - t0 - .5) / .4);
  return `<div class="screen cam">${status(true)}
    <img class="camImg" src="../sources/receipt-paper-masked.png" style="transform:translate(-50%,-50%) rotate(${(-1.2 + Math.sin(t * 2.2) * .35).toFixed(2)}deg) scale(${(1 + Math.sin(t * 1.7) * .006).toFixed(4)})">
    <svg style="position:absolute;inset:0;opacity:${found}" width="360" height="640"><polygon points="${[[33, 93], [327, 87], [331, 494], [37, 500]].map((p) => p.join(",")).join(" ")}" fill="rgba(26,115,232,.12)" stroke="#8ab4f8" stroke-width="2.5"/></svg>
    <div class="camTop"><span>${I("close", "font-size:22px")}</span><span style="font-size:14px;opacity:.9">Auto capture</span><span>${I("flash-outline", "font-size:20px")}</span></div>
    <div class="camHint" style="opacity:${1 - found}">Position the document in view</div>
    <div class="camBottom"><div class="shutterO"><div class="shutterI"></div></div></div>${nav(true)}</div>`;
}

function scanning(t) {
  const sweep = (t % 1.6) / 1.6;
  const breathe = (Math.sin(t * 3.4) + 1) / 2;
  const d = (i) => .35 + .65 * Math.max(0, Math.sin(t * 6 - i * 1.0));
  return `<div class="screen">${status()}<div class="body">
    <div class="sHead"><div class="back">${I("chevron-back")}</div><div class="sTitle">Scan receipt</div><div class="cancel">Cancel</div></div>
    <div class="scanWrap"><div class="stage"><div class="glow" style="opacity:${(.35 + .35 * breathe).toFixed(2)};transform:scale(${(1 + .16 * breathe).toFixed(3)})"></div>
      <div class="stile">${glyph(56)}<div class="sline" style="transform:translateY(${(sweep * 82).toFixed(1)}px);opacity:${sweep < .08 ? sweep / .08 : sweep > .92 ? (1 - sweep) / .08 : 1}"></div></div></div>
      <div><div class="stitle">Scanning receipt…</div><div class="ssub">Processing receipt…</div></div>
      <div class="sdots">${[0, 1, 2].map((i) => `<i style="opacity:${d(i).toFixed(2)}"></i>`).join("")}</div></div>
  </div>${nav()}</div>`;
}

function splash() {

// ── Timeline (seconds). Each entry: [start, end, draw(t)]
const TAPS = [[3.6, 320, 588], [6.1, 180, 360], [9.7, 180, 554], [14.9, 180, 595], [16.4, 180, 588], [17.6, 268, 398], [19.0, 97, 250], [22.5, 180, 595], [26.9, 180, 80], [32.0, 180, 80], [35.8, 318, 202]];
const SCRIPT = [
  [0.0, 4.0, () => home({})],
  [4.0, 7.0, () => scanIntro()],
  [7.0, 10.3, (t) => docScanner(7.0, t)],
  [10.3, 12.4, (t) => scanning(t)],
  [12.4, 15.3, () => confirm({ date: "Dec 5, 2025", sub: "79.92", tax: "4.03", total: "83.95" })],
  [15.3, 16.8, () => home({})],
  [16.8, 18.0, () => scanIntro()],
  [18.0, 19.4, () => filesPicker()],
  [19.4, 20.6, (t) => scanning(t)],
  [20.6, 22.9, () => confirm({ date: "Jun 28, 2025", sub: "304.78", tax: "32.02", total: "336.80" })],
  [22.9, 27.3, () => home({})],
  [27.3, 32.4, () => home({ drops: ["cof", "ket"], toClaim: 23, alerts: 2 })],
  [32.4, 36.2, () => home({ drops: ["tv", "gen", "cof", "ket"], toClaim: 1623, alerts: 4 })],
  [36.2, 41.6, (t) => detail(Math.round(ease((t - 38.2) / 1.2) * 150))],
  [41.6, 42.8, () => home({ drops: ["tv", "gen", "cof", "ket"], toClaim: 1623, alerts: 4 })],
  [42.8, 45.0, () => splash()],
];
const NOTIFS = [[24.6, 27.1, { urgent: false, body: "You can save $13.00 · 25d left." }], [29.6, 32.2, { urgent: true, body: "You can save $600.00 · Last day." }]];
const TRANS = 0.28; // screen push transition (Android: slide in from right)

window.DURATION = 45.0;
window.renderAt = function (t) {
  const phone = document.getElementById("phone");
  const i = SCRIPT.findIndex(([a, b]) => t >= a && t < b);
  const cur = SCRIPT[i >= 0 ? i : SCRIPT.length - 1];
  let html = "";
  const since = t - cur[0];
  if (i > 0 && since < TRANS && cur[0] !== 12.4 && cur[0] !== 20.6 && cur[0] !== 10.3 && cur[0] !== 19.4 && cur[0] !== 27.3 && cur[0] !== 32.4) {
    const p = ease(since / TRANS);
    const prev = SCRIPT[i - 1];
    html = `<div style="position:absolute;inset:0;transform:translateX(${(-90 * p).toFixed(1)}px)">${prev[2](cur[0] - .001)}</div>
            <div style="position:absolute;inset:0;transform:translateX(${(360 * (1 - p)).toFixed(1)}px);box-shadow:-8px 0 24px rgba(0,0,0,.12)">${cur[2](t)}</div>`;
  } else if (cur[0] === 42.8) {
    const p = clamp(since / .5);
    html = `<div style="position:absolute;inset:0">${SCRIPT[i - 1][2](t)}</div><div style="position:absolute;inset:0;opacity:${p}">${cur[2](t)}</div>`;
  } else {
    html = cur[2](t);
  }
  for (const [a, b, n] of NOTIFS) {
    if (t >= a && t < b) {
      const inP = ease((t - a) / .35), outP = ease((t - (b - .3)) / .3);
      html += `<div style="position:absolute;inset:0;transform:translateY(${(-130 * (1 - inP) - 130 * outP).toFixed(1)}px)">${notification(n)}</div>`;
    }
  }
  if (t >= 9.75 && t < 10.05) html += `<div class="flash" style="opacity:${(1 - (t - 9.75) / .3).toFixed(2)}"></div>`;
  for (const [tt, x, y] of TAPS) {
    if (t >= tt - .05 && t < tt + .35) {
      const p = clamp((t - tt + .05) / .4);
      html += `<div class="tap" style="left:${x}px;top:${y}px;opacity:${(1 - p * .9).toFixed(2)};transform:scale(${(1 + p * .25).toFixed(2)})"></div>`;
    }
  }
  phone.innerHTML = html;
};
window.renderAt(Number(new URLSearchParams(location.search).get("t") || 0));
</script></body></html>
