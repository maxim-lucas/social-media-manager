name: Social content check

# Validates every pack's schedule on every change to one: assets exist, captions
# are present and under Instagram's 2200-character limit once the disclaimer is
# appended, language matches the art, one feed post per day, ids unique, and the
# fortnight asks for a follow somewhere but not everywhere.
#
# What this deliberately does NOT do is re-render the packs. render.js resolves
# Roboto and Roboto Mono through the SYSTEM font list, and a runner's font
# versions will not match the build machine's byte for byte — so a CI render
# would either fail spuriously or, worse, quietly redefine what "correct" means.
# Rendering and the visual gates (each pack's scenes/verify.js) are run locally
# by whoever changes the copy. This job checks everything that is a fact about
# the files rather than about the fonts, which is cheap, fast and cannot flake.
#
# ── Why the filter is all of sm-content, and why every pack is named ───────
#
# The filter used to be `sm-content/evergreen/**`, which was right while
# evergreen was the only pack with a schedule and stopped being right when the
# second one landed. A PR touching only the community pack matches none of the
# old paths, and this job does not run at all.
#
# The sharper half was the step, not the filter. `publish-due.js --check` with
# no --pack defaults to evergreen, so on the runs that DID fire — the community
# pack's own PR among them, matched incidentally because its diff also touches
# scripts/publish-due.js — this job validated 22 evergreen slots and went green
# without ever looking at the 48 slots under review. A check that runs, passes
# and never read the thing being changed is worse than one that is skipped: the
# skip is at least visible on the PR.

on:
  pull_request:
    paths:
      - "sm-content/**"
      - "scripts/publish-due.js"
      - "scripts/check-copy.js"
      - ".github/workflows/social-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate every pack's schedule
        # Discovered, not listed — the same reason check-copy.js discovers packs
        # rather than naming them. A hardcoded list is a list the next pack gets
        # left off, and being left off this one is silent.
        run: |
          for s in sm-content/*/schedule.json; do
            pack="$(basename "$(dirname "$s")")"
            echo "── $pack"
            node scripts/publish-due.js --pack="$pack" --check
          done

      - name: Print every run
        run: |
          for s in sm-content/*/schedule.json; do
            node scripts/publish-due.js --pack="$(basename "$(dirname "$s")")" --print
          done

      - name: Assert the packs' copy gate is intact
        # Each pack's scenes/verify.js needs sharp and fonts for its visual
        # gates, but its copy gate is pure JSON and markdown. Re-checking the ban
        # lists here means a caption, an art string or a Reel line that names a
        # retailer without its disclaimer, states a claim window in days, or
        # prints a figure cannot reach main even if nobody ran verify.js locally.
        run: node scripts/check-copy.js
